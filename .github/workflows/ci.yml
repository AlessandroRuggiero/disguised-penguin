name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Vet
        run: go vet ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run unit tests
        run: make test

  smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run smoke suite
        run: go test -tags=smoke -v ./e2e/...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Run integration suite
        run: go test -tags=integration -timeout 300s -v ./e2e/...

  build:
    name: Build & Release
    needs: [vet, unit, smoke, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make dist
          cp bin/dp-linux-amd64 bin/dp

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: dp
          path: bin/dp

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/dp
            bin/dp-linux-amd64
            bin/dp-darwin-amd64
            bin/dp-darwin-arm64
            bin/dp-windows-amd64.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
